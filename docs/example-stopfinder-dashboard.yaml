views:
  - title: Home
    cards:
      - type: vertical-stack
        cards:
          - type: entity
            entity: sensor.date
            name: "Today's Date:"
          - type: map
            fit_zones: true
            auto_fit: true
            hours_to_show: 0.25
            default_zoom: 17
            entities:
              - entity: zone.home
              - entity: person.bus_108
            theme_mode: auto
            title: Bus Location
            card_mod:
              style:
                ha-map$: |
                  .leaflet-control-attribution {
                    visibility: hidden;
                   }
                ha-map $ ha-entity-marker $: |
                  .marker {
                    background-color: transparent !important;
                  }
          - type: horizontal-stack
            cards:
              - type: entities
                entities:
                  - entity: sensor.bus_108_home_pickup
                    name: Pickup
                    icon: mdi:home
                  - entity: sensor.bus_108_school_dropoff
                    name: Dropoff
                  - entity: sensor.bus_108_school_pickup
                    name: Pickup
                  - entity: sensor.bus_108_home_dropoff
                    name: Dropoff
                    icon: mdi:home
                title: Schedule
              - type: entities
                entities:
                  - entity: sensor.bus_108_home_pickup_actual
                    name: Pickup
                    icon: mdi:home-clock-outline
                  - entity: sensor.bus_108_school_dropoff_actual
                    name: Dropoff
                  - entity: sensor.bus_108_school_pickup_actual
                    name: Pickup
                  - entity: sensor.bus_108_home_dropoff_actual
                    name: Dropoff
                    icon: mdi:home-clock-outline
                title: Actual
    type: custom:vertical-layout
    subview: false
