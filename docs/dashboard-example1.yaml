# Stopfinder Bus Tracker Dashboard
#
# SETUP:
#   1. Find your student's device_tracker entity:
#      Developer Tools → States → search "device_tracker." and look for "_stopfinder"
#      Example: device_tracker.john_stopfinder → STUDENT_NAME = john
#   2. Search-and-replace STUDENT_NAME with your student's first name (lowercase).
#   3. For multiple students, duplicate the vertical-stack block.
#   4. Import: Dashboard → Edit → Raw Configuration Editor → paste.

title: Stopfinder

views:
  - title: Bus Tracker
    path: bus-tracker
    icon: mdi:bus-school
    cards:

      # ── Student STUDENT_NAME ──────────────────────────────────────────────
      - type: vertical-stack
        cards:

          - type: map
            title: Bus Tracker
            hours_to_show: 0.5
            default_zoom: 16
            auto_fit: true
            fit_zones: true
            entities:
              - entity: device_tracker.STUDENT_NAME_stopfinder
              #- entity: zone.home
            # ── card_mod users ──────────────────────────────────────────────
            # Requires the card_mod HACS frontend resource.
            #card_mod:
            #  style:
            #    ha-map$: |
            #      .leaflet-control-attribution {
            #        visibility: hidden;
            #      }
            #    ha-map $ ha-entity-marker $: |
            #      .marker {
            #        background-color: transparent !important;
            #      }

          # ── Status / tracking info ────────────────────────────────────────
          - type: markdown
            content: |
              {%- set time_fmt = '%H:%M' -%}
              {#- Change to '%I:%M %p' for 12-hour format -#}
              {%- set dt = 'device_tracker.STUDENT_NAME_stopfinder' -%}
              {%- set sn_hp = state_attr(dt, 'home_pickup_stop_name') -%}
              {%- set sn_sd = state_attr(dt, 'school_dropoff_stop_name') -%}
              {%- set sn_sp = state_attr(dt, 'school_pickup_stop_name') -%}
              {%- set sn_hd = state_attr(dt, 'home_dropoff_stop_name') -%}
              {%- set am_bus = state_attr(dt, 'morning_bus_number') -%}
              {%- set pm_bus = state_attr(dt, 'afternoon_bus_number') -%}
              {%- set ns = namespace(chip='No active trip') -%}
              {%- if state_attr(dt, 'tracking_active') -%}
                {%- set trip = state_attr(dt, 'active_trip') -%}
                {%- set ns.chip = ('Morning' if trip == 'morning' else 'Afternoon') ~ ' active' -%}
              {%- endif -%}
              {%- set last_gps = (states[dt].last_updated | as_timestamp | timestamp_custom(time_fmt)) if states[dt] else '—' -%}
              <table width="100%"><tr><td>{{ ns.chip }}</td><td align="right"><small>Last GPS Update: {{ last_gps }}</small></td></tr></table>

              <ha-icon icon="mdi:home-clock-outline"></ha-icon> **Morning** {% if am_bus %}<small>(Bus {{ am_bus }})</small>{% endif %}
              {% if sn_hp or sn_sd %}<small><ha-icon icon="mdi:home"></ha-icon> {{ sn_hp or '—' }} &nbsp;→&nbsp; <ha-icon icon="mdi:school"></ha-icon> {{ sn_sd or '—' }}</small>{% endif %}

              <ha-icon icon="mdi:school-outline"></ha-icon> **Afternoon** {% if pm_bus %}<small>(Bus {{ pm_bus }})</small>{% endif %}
              {% if sn_sp or sn_hd %}<small><ha-icon icon="mdi:school"></ha-icon> {{ sn_sp or '—' }} &nbsp;→&nbsp; <ha-icon icon="mdi:home"></ha-icon> {{ sn_hd or '—' }}</small>{% endif %}

            #card_mod:
            #  style:
            #    ha-markdown$: |
            #      ha-markdown-element {
            #        --markdown-table-border-width: 0;
            #        --markdown-table-border-style: none;
            #      }

          # ── Schedule table ────────────────────────────────────────────────
          - type: markdown
            content: |
              {%- set time_fmt = '%H:%M' -%}
              {#- Change to '%I:%M %p' for 12-hour format -#}
              {%- macro fmt(s) -%}
                {%- if s in ['unknown','unavailable'] -%}—{%- else -%}{{ as_timestamp(s) | timestamp_custom(time_fmt) }}{%- endif -%}
              {%- endmacro -%}
              {%- macro delta(sc, ac) -%}
                {%- if ac not in ['unknown','unavailable'] and sc not in ['unknown','unavailable'] -%}
                  {%- set d = ((as_timestamp(ac) - as_timestamp(sc)) / 60) | round(0) | int -%}
                  {%- if d == 0 %} <em>(on time)</em>{%- elif d > 0 %} <em>(+{{ d }}m)</em>{%- else %} <em>({{ d }}m)</em>{%- endif -%}
                {%- endif -%}
              {%- endmacro -%}
              {%- set s_hp = states('sensor.STUDENT_NAME_stopfinder_home_pickup') -%}
              {%- set s_sd = states('sensor.STUDENT_NAME_stopfinder_school_dropoff') -%}
              {%- set s_sp = states('sensor.STUDENT_NAME_stopfinder_school_pickup') -%}
              {%- set s_hd = states('sensor.STUDENT_NAME_stopfinder_home_dropoff') -%}
              {%- set a_hp = states('sensor.STUDENT_NAME_stopfinder_home_pickup_actual') -%}
              {%- set a_sd = states('sensor.STUDENT_NAME_stopfinder_school_dropoff_actual') -%}
              {%- set a_sp = states('sensor.STUDENT_NAME_stopfinder_school_pickup_actual') -%}
              {%- set a_hd = states('sensor.STUDENT_NAME_stopfinder_home_dropoff_actual') -%}
              <table width="100%">
              <tr>
                <th align="left" width="34%">&nbsp;</th>
                <th align="center" width="33%">Scheduled</th>
                <th align="center" width="33%">Actual</th>
              </tr>
              <tr>
                <td><ha-icon icon="mdi:home"></ha-icon> Pickup</td>
                <td align="center">{{ fmt(s_hp) }}</td>
                <td align="center">{{ fmt(a_hp) }}{{ delta(s_hp, a_hp) }}</td>
              </tr>
              <tr>
                <td><ha-icon icon="mdi:school"></ha-icon> Dropoff</td>
                <td align="center">{{ fmt(s_sd) }}</td>
                <td align="center">{{ fmt(a_sd) }}{{ delta(s_sd, a_sd) }}</td>
              </tr>
              <tr>
                <td><ha-icon icon="mdi:school"></ha-icon> Pickup</td>
                <td align="center">{{ fmt(s_sp) }}</td>
                <td align="center">{{ fmt(a_sp) }}{{ delta(s_sp, a_sp) }}</td>
              </tr>
              <tr>
                <td><ha-icon icon="mdi:home"></ha-icon> Dropoff</td>
                <td align="center">{{ fmt(s_hd) }}</td>
                <td align="center">{{ fmt(a_hd) }}{{ delta(s_hd, a_hd) }}</td>
              </tr>
              </table>
            #card_mod:
            #  style:
            #    ha-markdown$: |
            #      ha-markdown-element {
            #        --markdown-table-border-width: 0;
            #        --markdown-table-border-style: none;
            #      }
            #      table {
            #        border-collapse: collapse;
            #      }
            #      table th {
            #        text-align: center;
            #      }
            #      table th:first-child {
            #        text-align: left;
            #      }
            #      table td:not([colspan]) {
            #        border: 1px solid var(--divider-color, rgba(255,255,255,0.15)) !important;
            #        padding: 4px 8px !important;
            #      }

      # ── Add additional students below ──────────────────────────────────────
      # - type: vertical-stack
      #   cards:
      #     - type: map
      #       ...
