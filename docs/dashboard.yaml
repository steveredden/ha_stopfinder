# Stopfinder Bus Tracker Dashboard
#
# SETUP:
#   1. Find your bus number: Developer Tools → States → search "device_tracker.bus_"
#      Example: device_tracker.bus_201abc → BUS_NUMBER = 201abc
#   2. Search-and-replace BUS_NUMBER with your actual bus number.
#   3. For multiple buses, duplicate the vertical-stack block.
#   4. Import: Dashboard → Edit → Raw Configuration Editor → paste.

title: Stopfinder

views:
  - title: Bus Tracker
    path: bus-tracker
    icon: mdi:bus-school
    cards:

      # ── Bus BUS_NUMBER ────────────────────────────────────────────────────
      - type: vertical-stack
        cards:

          - type: map
            title: Bus BUS_NUMBER
            hours_to_show: 0.5
            default_zoom: 16
            auto_fit: true
            fit_zones: true
            entities:
              - entity: device_tracker.bus_BUS_NUMBER
              #- entity: zone.home
            # ── card_mod users ──────────────────────────────────────────────
            #card_mod:
            #  style:
            #    ha-map$: |
            #      .leaflet-control-attribution {
            #        visibility: hidden;
            #       }
            #    ha-map $ ha-entity-marker $: |
            #      .marker {
            #        background-color: transparent !important;
            #      }

          - type: markdown
            content: |
              {%- macro fmt(s) -%}
                {%- if s in ['unknown','unavailable'] -%}—{%- else -%}{{ as_timestamp(s) | timestamp_custom('%H:%M') }}{%- endif -%}
              {%- endmacro -%}
              {%- macro delta(sc, ac) -%}
                {%- if ac not in ['unknown','unavailable'] and sc not in ['unknown','unavailable'] -%}
                  {%- set d = ((as_timestamp(ac) - as_timestamp(sc)) / 60) | round(0) | int -%}
                  {%- if d == 0 %} *(on time)*{%- elif d > 0 %} *(+{{ d }}m)*{%- else %} *({{ d }}m)*{%- endif -%}
                {%- endif -%}
              {%- endmacro -%}
              {%- macro dur(t1, t2) -%}
                {%- if t1 not in ['unknown','unavailable'] and t2 not in ['unknown','unavailable'] -%}
                  {%- set d = ((as_timestamp(t2) - as_timestamp(t1)) / 60) | round(0) | int -%}
                   · {{ d }} min
                {%- endif -%}
              {%- endmacro -%}
              {%- set s_hp = states('sensor.bus_BUS_NUMBER_home_pickup') -%}
              {%- set s_sd = states('sensor.bus_BUS_NUMBER_school_dropoff') -%}
              {%- set s_sp = states('sensor.bus_BUS_NUMBER_school_pickup') -%}
              {%- set s_hd = states('sensor.bus_BUS_NUMBER_home_dropoff') -%}
              {%- set a_hp = states('sensor.bus_BUS_NUMBER_home_pickup_actual') -%}
              {%- set a_sd = states('sensor.bus_BUS_NUMBER_school_dropoff_actual') -%}
              {%- set a_sp = states('sensor.bus_BUS_NUMBER_school_pickup_actual') -%}
              {%- set a_hd = states('sensor.bus_BUS_NUMBER_home_dropoff_actual') -%}
              <table width="100%" style="border-collapse: collapse">
              <tr>
                <th align="left" width="45%">&nbsp;</th>
                <th align="right" width="22%">Sched</th>
                <th align="left" width="33%">Actual</th>
              </tr>
              <tr><td colspan="3"><b>Morning</b>{{ dur(a_hp, a_sd) }}</td></tr>
              <tr>
                <td style="border: 1px solid var(--divider-color); padding: 4px 8px"><ha-icon icon="mdi:home"></ha-icon> Pickup</td>
                <td align="right" style="border: 1px solid var(--divider-color); padding: 4px 8px">{{ fmt(s_hp) }}</td>
                <td style="border: 1px solid var(--divider-color); padding: 4px 8px">{{ fmt(a_hp) }}{{ delta(s_hp, a_hp) }}</td>
              </tr>
              <tr>
                <td style="border: 1px solid var(--divider-color); padding: 4px 8px"><ha-icon icon="mdi:school"></ha-icon> Dropoff</td>
                <td align="right" style="border: 1px solid var(--divider-color); padding: 4px 8px">{{ fmt(s_sd) }}</td>
                <td style="border: 1px solid var(--divider-color); padding: 4px 8px">{{ fmt(a_sd) }}{{ delta(s_sd, a_sd) }}</td>
              </tr>
              <tr><td colspan="3"><br><b>Afternoon</b>{{ dur(a_sp, a_hd) }}</td></tr>
              <tr>
                <td style="border: 1px solid var(--divider-color); padding: 4px 8px"><ha-icon icon="mdi:school"></ha-icon> Pickup</td>
                <td align="right" style="border: 1px solid var(--divider-color); padding: 4px 8px">{{ fmt(s_sp) }}</td>
                <td style="border: 1px solid var(--divider-color); padding: 4px 8px">{{ fmt(a_sp) }}{{ delta(s_sp, a_sp) }}</td>
              </tr>
              <tr>
                <td style="border: 1px solid var(--divider-color); padding: 4px 8px"><ha-icon icon="mdi:home"></ha-icon> Dropoff</td>
                <td align="right" style="border: 1px solid var(--divider-color); padding: 4px 8px">{{ fmt(s_hd) }}</td>
                <td style="border: 1px solid var(--divider-color); padding: 4px 8px">{{ fmt(a_hd) }}{{ delta(s_hd, a_hd) }}</td>
              </tr>
              </table>

      # ── Add additional buses below ─────────────────────────────────────────
      # - type: vertical-stack
      #   cards:
      #     - type: map
      #       ...
